<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Jugador</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="login-page">

    <section class="login-shell" aria-label="Panel de login jugador">

      <div class="login-card">

        <div class="login-header">
          <div class="icon" aria-hidden="true"></div>
          <h1>Login Jugador</h1>
          <p>Ingresá tus credenciales</p>
        </div>

        <form id="formLoginJugador" class="login-form">

          <div class="form-group">
            <label class="input-label" for="nombre-jugador">
              <span class="input-icon" aria-hidden="true">🐎</span>
              <input id="nombre-jugador" name="nombre" type="text" placeholder="Usuario" autocomplete="username" required />
            </label>
          </div>

          <div class="form-group">
            <label class="input-label" for="password-jugador">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input id="password-jugador" name="password" type="password" placeholder="Contraseña"
                autocomplete="current-password" required />
            </label>
          </div>

          <p id="mensajeError" class="error hidden" role="alert"></p>

          <button class="login-button" type="submit" id="btnLoginjugador">
            Ingresar
          </button>

        </form>

      </div>

    </section>

  </main>

  <!-- JavaScript usando CommandDispatcher -->
  <script type="module">
    import dispatcher from  './CommandDispatcher.js';

    // ================================
    // 1. Elementos del HTML
    // ================================

    const formLoginJugador = document.getElementById('formLoginJugador');
    const inputNombre = document.getElementById('nombre-jugador');
    const inputPassword = document.getElementById('password-jugador');
    const mensajeError = document.getElementById('mensajeError');
    const btnLogin = document.getElementById('btnLoginjugador');

    // ================================
    // 2. Funciones auxiliares de vista
    // ================================
    function limpiarFormulario() {
      inputNombre.value = '';
      inputPassword.value = '';
    }

    function mostrarError(texto) {
      mensajeError.textContent = texto;
      mensajeError.classList.remove('hidden');
    }

    function ocultarError() {
      mensajeError.textContent = '';
      mensajeError.classList.add('hidden');
    }

    function bloquearBoton() {
      btnLogin.disabled = true;
      btnLogin.textContent = 'Ingresando...';
    }

    function desbloquearBoton() {
      btnLogin.disabled = false;
      btnLogin.textContent = 'Ingresar';
    }

    // ================================
    // 3. Registro de la vista
    // ================================

    const view = dispatcher.registerView('loginJugador', {
   
      urlInicio: null,

      onError: (status, texto) => {
        desbloquearBoton();
        mostrarError(`Error ${status}: ${texto}`);
      },

      onException: (msg) => {
        desbloquearBoton();
        mostrarError(msg);
      }
    });

    // ================================
    // 4. Handlers que responde el backend
    // ================================

    view.handler('redirigir-tablero-jugador', (url) => {
      window.location.href = url;
    });

   
    view.handler('error', (mensaje) => {
      desbloquearBoton();
      mostrarError(mensaje);
    });


    view.handler('limpiarError', () => {
      ocultarError();
    });

    // Iniciamos la vista
    dispatcher.startView(view);

    // ================================
    // 5. Envío del formulario
    // ================================

    formLoginJugador.addEventListener('submit', (event) => {
      event.preventDefault();

      ocultarError();

      const nombre = inputNombre.value.trim();
      const password = inputPassword.value.trim();

      if (nombre === '' || password === '') {
        mostrarError('Debes ingresar usuario y contraseña.');
        return;
      }

      bloquearBoton();


      dispatcher.submit('/login-jugador', {
        nombre: nombre,
        password: password
      });
    });
  </script>

</body>

</html>
